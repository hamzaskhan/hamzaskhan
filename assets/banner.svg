<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Hamza  backend engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFF9EF"/>
      <stop offset="100%" stop-color="#F7E7C3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="50%" stop-color="#F0D78C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5E6A3" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect x="3" y="3" width="1194" height="274" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="14" y="14" width="1172" height="252" rx="12" fill="url(#shine)" opacity="0.35"/>

  <!-- soft gold orbs -->
  <circle cx="980" cy="70" r="90" fill="#F0D78C" opacity="0.18"/>
  <circle cx="180" cy="220" r="70" fill="#E8C96A" opacity="0.14"/>

  <text x="60" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="url(#gold)">Hamza Khan</text>
  <text x="62" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#6B5A2E">Backend engineer</text>
  <text x="62" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8A7A4E">distributed systems · AI infrastructure · robotics</text>

  <!-- sparks -->
  <g filter="url(#glow)">
    <circle cx="720" cy="60" r="3" fill="#FFD700">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;40;60" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="95" r="2.2" fill="#FFF4C2">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="760;790;760" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="50" r="2.8" fill="#E8C96A">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="110" r="2" fill="#FFECB3">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;3;1" dur="1.6s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="75" r="3.2" fill="#FFD700">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="75;55;75" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="130" r="2.4" fill="#FFF8DC">
      <animate attributeName="opacity" values="0.1;0.95;0.1" dur="1.9s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="90" r="2" fill="#F0D78C">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="55" r="2.6" fill="#FFD700">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="55;35;55" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="140" r="1.8" fill="#FFE082">
      <animate attributeName="opacity" values="0;1;0" dur="1.7s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="200" r="2.3" fill="#E8C96A">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.3s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <!-- tiny star sparks -->
    <path d="M850 160 L852 166 L858 166 L853 170 L855 176 L850 172 L845 176 L847 170 L842 166 L848 166 Z" fill="#FFD700" opacity="0.7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 850 168;20 850 168;0 850 168" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1080 170 L1081.5 174 L1085.5 174 L1082.5 176.5 L1083.5 180.5 L1080 178 L1076.5 180.5 L1077.5 176.5 L1074.5 174 L1078.5 174 Z" fill="#FFF4C2">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
