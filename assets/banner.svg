<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06140c"/>
      <stop offset="48%" stop-color="#0a1a12"/>
      <stop offset="52%" stop-color="#1a0a0c"/>
      <stop offset="100%" stop-color="#140608"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="50%" x2="55%" y2="50%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="100%" y1="50%" x2="45%" y2="50%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="45%" stop-color="#f0fdf4"/>
      <stop offset="55%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#greenGlow)"/>
  <rect x="800" width="800" height="420" fill="url(#redGlow)"/>

  <!-- fracture line down the middle -->
  <path d="M798 0 L812 70 L792 140 L818 210 L788 280 L810 350 L800 420" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.55"/>
  <path d="M802 0 L790 80 L814 150 L786 220 L816 300 L794 370 L804 420" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.4"/>

  <!-- hex lattice hint -->
  <g opacity="0.12" fill="none" stroke="#4ade80" stroke-width="1">
    <path d="M80 60 l40 0 l20 34 l-20 34 l-40 0 l-20 -34 z"/>
    <path d="M160 128 l40 0 l20 34 l-20 34 l-40 0 l-20 -34 z"/>
    <path d="M80 196 l40 0 l20 34 l-20 34 l-40 0 l-20 -34 z"/>
  </g>
  <g opacity="0.12" fill="none" stroke="#f87171" stroke-width="1">
    <path d="M1400 80 l40 0 l20 34 l-20 34 l-40 0 l-20 -34 z"/>
    <path d="M1480 148 l40 0 l20 34 l-20 34 l-40 0 l-20 -34 z"/>
    <path d="M1400 216 l40 0 l20 34 l-20 34 l-40 0 l-20 -34 z"/>
  </g>

  <rect x="4" y="4" width="1592" height="412" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <text x="80" y="175" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" fill="url(#nameFill)">HAMZA KHAN</text>
  <text x="84" y="235" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#e5e7eb">BACKEND-FOCUSED FULL STACK ENGINEER</text>
  <text x="84" y="285" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#a7f3d0">distributed systems</text>
  <text x="320" y="285" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6b7280">/</text>
  <text x="340" y="285" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fecaca">AI infrastructure</text>
  <text x="540" y="285" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6b7280">/</text>
  <text x="560" y="285" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#86efac">cloud-native</text>
  <text x="84" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#9ca3af">hamzakhan.dev  |  Python and Node.js  |  build under pressure</text>

  <!-- sparks / embers -->
  <g>
    <circle cx="1180" cy="90" r="4" fill="#ef4444">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;55;90" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1240" cy="140" r="3" fill="#4ade80">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.7s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;100;140" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1320" cy="70" r="3.5" fill="#f87171">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1380" cy="160" r="2.5" fill="#86efac">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1460" cy="110" r="4" fill="#dc2626">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;70;110" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="200" r="2" fill="#bbf7d0">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1520" cy="200" r="3" fill="#fca5a5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1260" cy="250" r="2.2" fill="#22c55e">
      <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
