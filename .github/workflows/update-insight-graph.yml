name: Update insight graph

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_insight_graph.py"
      - ".github/workflows/update-insight-graph.yml"

permissions:
  contents: write

jobs:
  insight-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate work signature graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: hamzaskhan
        run: python scripts/generate_insight_graph.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/insight-graph.svg
          if git diff --staged --quiet; then
            echo "No graph changes"
            exit 0
          fi
          git commit -m "chore: update work signature insight graph"
          git push
